name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  JAVA_VERSION: '21'

jobs:
  # 1. Job de Testes
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Configura o ambiente Java e ativa o cache automático do Maven (.m2)
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: './agenda-tenancy/pom.xml'

      - name: Run Backend Tests (Quarkus)
        run: |
          echo "Executando testes do Quarkus em agenda-tenancy..."
          cd agenda-tenancy
          ./mvnw test 

      - name: Run Frontend Tests
        run: |
          echo "Executando testes do Front-end..."
          # cd frontend && npm test -- --watchAll=false

  # 2. Job de Build (Valida no PR e envia no Merge)
  build-and-push:
    needs: test
    # Removido o 'if' daqui para permitir que o job rode também em Pull Requests!
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- BACKEND (agenda-tenancy) ---
      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./agenda-tenancy
          file: ./agenda-tenancy/Dockerfile
          # SÓ FAZ O PUSH SE FOR UM COMMIT DIRETO OU MERGE CONCLUÍDO
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- FRONTEND ---
      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          # SÓ FAZ O PUSH SE FOR UM COMMIT DIRETO OU MERGE CONCLUÍDO
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

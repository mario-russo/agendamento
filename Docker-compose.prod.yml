services:
  # ============================
  # FRONTEND (Nginx + Vue + proxy para Quarkus)
  # ============================
  frontend:
    image: ghcr.io/mario-russo/agendamento-frontend:latest
    container_name: nginx-vue
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

  # ============================
  # BACKEND QUARKUS
  # ============================
  backend:
    image: ghcr.io/mario-russo/agendamento-backend:latest
    container_name: quarkus-backend
    environment:
      # ---------- BANCO DE DADOS ----------
      DB_URL: jdbc:postgresql://postgres:5432/meubanco
      DB_USERNAME: meuuser
      DB_PASSWORD: minhasenha
      DB_KIND: postgresql

      QUARKUS_HTTP_HOST: 0.0.0.0
      QUARKUS_HTTP_PORT: 8080

      # FRONTEND_URL: frontend
      # ---------- JWT ----------
      # Descomente e ajuste conforme seu projeto
      JWT_PUBLIC_KEY: /run/secrets/jwt_public_key
      JWT_PRIVATE_KEY: /run/secrets/jwt_private_key
      JWT_ISSUER: mario-russo

    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    secrets:
      - jwt_private_key
      - jwt_public_key

  # ============================
  # POSTGRESQL
  # ============================
  postgres:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_DB: meubanco
      POSTGRES_USER: meuuser
      POSTGRES_PASSWORD: minhasenha
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meuuser -d meubanco"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

# ============================
# VOLUMES
# ============================
volumes:
  postgres-data:

# ============================
# REDE
# ============================
networks:
  app-network:
    driver: bridge

secrets:
  jwt_private_key:
    file: ./secrets/privateKey.pem
  jwt_public_key:
    file: ./secrets/publicKey.pem

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/lyn
quarkus.hibernate-orm.log.sql=true

mp.jwt.verify.issuer=mario-russo
smallrye.jwt.sign.key.location=file:${JWT_PRIVATE_KEY:./secrets/privateKey.pem}
mp.jwt.verify.publickey.location=file:${JWT_PUBLIC_KEY:./secrets/publicKey.pem}
smallrye.jwt.sign.algorithm=RS256
jwt.expiration=3600
jwt.refresh-expiration=86400

quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

# Configuração CORRETA de CORS para o Frontend (Quasar/Vite)
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FRONTEND_URL:http://localhost:9000}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

